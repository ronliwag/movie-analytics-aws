version: 2

seeds:
  - name: iso_639_1
    description: >
      ISO 639-1 code -> English name reference table. dim_language.sql
      joins against this for its display name instead of TMDB's own
      spoken_language_names, which leaves ~19 of these codes blank even at
      the source (see docs/DATA_MODEL.md known limitations). Generated by
      scripts/enrichment/generate_iso_639_1_seed.py from pycountry (bundles
      the Debian iso-codes project) -- static reference data, not something
      the pipeline regenerates on its own; regenerate and commit by hand if
      the wording ever needs to change.
    columns:
      - name: code
        description: ISO 639-1 two-letter language code. Natural primary key.
        tests:
          - unique
          - not_null
      - name: name
        description: >
          Canonical English language name, from pycountry/iso-codes.
          Occasionally uses registry wording over the more familiar term
          (e.g. "Kirghiz" not "Kyrgyz", "Pushto" not "Pashto") -- verifiable
          over hand-typed, even where less immediately recognizable.
        tests:
          - not_null
